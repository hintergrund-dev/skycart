<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="A marketplace sits between buyer and shop; skycart only points to the shop">
<style>svg{--fg:#0e1630;--muted:#56607a;--line:#b9c3dc;--box:#e9eef9;--accent:#1f3fbf;--on:#ffffff;--soft:#ffc83d}@media (prefers-color-scheme:dark){svg{--fg:#e9edf8;--muted:#a2abc4;--line:#3a4670;--box:#151c33;--accent:#8ea6ff;--on:#0c1122;--soft:#ffc83d}}
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--fg)}
.t{font-weight:650}.s{fill:var(--muted)}.h{font-weight:700;letter-spacing:.06em;fill:var(--muted)}
.on{fill:var(--on)}.ac{fill:var(--accent);font-weight:650}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.solid{fill:var(--accent)}
.ln{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.la{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:5 6}
.mk{fill:var(--line)}.mka{fill:var(--accent)}
.dot{fill:var(--on);stroke:var(--accent);stroke-width:2}.dots{fill:var(--soft)}
.panel{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 6}
@media (prefers-reduced-motion:reduce){.dot,.dots{display:none}}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="mka" d="M0 0L10 5L0 10z"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto-start-reverse"><path class="mka" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="panel" x="24" y="14" width="352" height="262" rx="16"/><text x="200" y="44" font-size="12" text-anchor="middle" class="h">MARKETPLACE</text><rect class="box" x="40" y="136" width="76" height="56" rx="12"/><text x="78" y="169" font-size="14.5" text-anchor="middle" class="t">Buyer</text><rect class="box" x="284" y="136" width="76" height="56" rx="12"/><text x="322" y="169" font-size="14.5" text-anchor="middle" class="t">Shop</text><rect class="solid" x="146" y="118" width="108" height="92" rx="12"/><text x="200" y="161" font-size="14.5" text-anchor="middle" class="t on">Platform</text><text x="200" y="179" font-size="10.1" text-anchor="middle" class="on">commission · data</text><path class="ln" d="M116 164H138" style="stroke-width:2;stroke-linecap:butt" marker-end="url(#a)"/><path class="ln" d="M254 164H276" style="stroke-width:2;stroke-linecap:butt" marker-end="url(#a)"/><circle class="dots" r="5" style="stroke:var(--accent);stroke-width:2"><animateMotion dur="3.4s" repeatCount="indefinite" path="M116 164H284"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.8;0.92;1" dur="3.4s" repeatCount="indefinite"/></circle><text x="200" y="250" font-size="10.6" text-anchor="middle" class="s">Order, payment and customer data pass through the platform.</text><rect class="panel" x="384" y="14" width="352" height="262" rx="16"/><text x="560" y="44" font-size="12" text-anchor="middle" class="h">SKYCART</text><rect class="box" x="400" y="136" width="76" height="56" rx="12"/><text x="438" y="169" font-size="14.5" text-anchor="middle" class="t">Buyer</text><rect class="box" x="644" y="136" width="76" height="56" rx="12"/><text x="682" y="169" font-size="14.5" text-anchor="middle" class="t">Shop</text><rect class="box" x="504" y="66" width="112" height="52" rx="12"/><text x="560" y="89" font-size="14.5" text-anchor="middle" class="t">skycart</text><text x="560" y="107" font-size="12" text-anchor="middle" class="s">index only</text><path class="ln dash" d="M438 136C442 108 468 94 496 92" style="stroke-width:2;stroke-linecap:butt" marker-end="url(#a)"/><path class="ln dash" d="M616 92C650 94 676 104 681 128" style="stroke-width:2;stroke-linecap:butt" marker-end="url(#a)"/><text x="446" y="84" font-size="11.5" text-anchor="middle" class="s">search</text><text x="676" y="84" font-size="11.5" text-anchor="middle" class="s">indexes</text><path class="la" d="M476 164H634" style="stroke-width:3.5;stroke-linecap:butt" marker-end="url(#c)"/><circle class="dot" r="3.0" opacity="0"><animateMotion dur="2s" begin="-1.5s" repeatCount="indefinite" path="M476 164H634"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.62;0.8;1" dur="2s" begin="-1.5s" repeatCount="indefinite"/></circle><text x="560" y="190" font-size="12.5" text-anchor="middle" class="ac">buys directly</text><text x="560" y="250" font-size="10.8" text-anchor="middle" class="s">skycart never sees the order, the payment or the customer.</text>
</svg>
