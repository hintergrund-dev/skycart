<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" role="img" aria-label="Search on skycart, go to the shop, buy on the shop’s own site">
<style>svg{--fg:#e9edf8;--muted:#a2abc4;--line:#3a4670;--box:#151c33;--accent:#8ea6ff;--on:#0c1122;--soft:#ffc83d}
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--fg)}
.t{font-weight:650}.s{fill:var(--muted)}.h{font-weight:700;letter-spacing:.06em;fill:var(--muted)}
.on{fill:var(--on)}.ac{fill:var(--accent);font-weight:650}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.solid{fill:var(--accent)}
.ln{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.la{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:5 6}
.mk{fill:var(--line)}.mka{fill:var(--accent)}
.dot{fill:var(--on);stroke:var(--accent);stroke-width:2}.dots{fill:var(--soft)}
.panel{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 6}
@media (prefers-reduced-motion:reduce){.dot,.dots{display:none}}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="mka" d="M0 0L10 5L0 10z"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto-start-reverse"><path class="mka" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="box" x="24" y="32" width="216" height="88" rx="12"/><text x="132" y="73" font-size="14.5" text-anchor="middle" class="t">1 · Search on skycart</text><text x="132" y="91" font-size="12" text-anchor="middle" class="s">find an item</text><path class="ln" d="M240 76H264" style="stroke-width:2;stroke-linecap:butt" marker-end="url(#a)"/><rect class="box" x="272" y="32" width="216" height="88" rx="12"/><text x="380" y="73" font-size="14.5" text-anchor="middle" class="t">2 · Go to shop</text><text x="380" y="91" font-size="12" text-anchor="middle" class="s">opens the item’s checkout URL</text><path class="la" d="M488 76H512" style="stroke-width:2;stroke-linecap:butt" marker-end="url(#b)"/><rect class="solid" x="520" y="32" width="216" height="88" rx="12"/><text x="628" y="73" font-size="14.5" text-anchor="middle" class="t on">3 · Buy at the shop</text><text x="628" y="91" font-size="12" text-anchor="middle" class="on">contract · payment · shipping</text><path class="ln" d="M24 150H488"/><path class="la" d="M520 150H736" style="stroke-width:3"/><circle class="dots" r="6" style="stroke:var(--accent);stroke-width:2"><animateMotion dur="5s" repeatCount="indefinite" path="M24 150H736"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.85;0.95;1" dur="5s" repeatCount="indefinite"/></circle><text x="256" y="174" font-size="12.5" text-anchor="middle" class="s">on skycart.eu</text><text x="628" y="174" font-size="12.5" text-anchor="middle" class="ac">on the shop’s own website</text><text x="628" y="192" font-size="11" text-anchor="middle" class="s">money and data go to the shop only</text>
</svg>
